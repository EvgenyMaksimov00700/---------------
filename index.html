<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Тигра — Детские праздники в Казани</title>
    <script>
      async function redirectToSite() {
        const candidates = ["./public/index.html", "./Public/index.html"];
        if (window.location.protocol === "file:") {
          window.location.replace(candidates[0]);
          return;
        }
        for (const url of candidates) {
          try {
            const response = await fetch(url, { method: "HEAD" });
            if (response.ok) {
              window.location.replace(url);
              return;
            }
          } catch (_) {}
        }
        // Fallback: still attempt redirect even when HEAD checks fail (e.g. file:// or network issues).
        window.location.replace(candidates[0]);
      }
      redirectToSite();
    </script>
  </head>
  <body>
    <p id="redirectStatus">
      Переходим на сайт... Если не открылось автоматически, попробуйте
      <a href="./public/index.html">public</a>
      или
      <a href="./Public/index.html">Public</a>.
    </p>
    <noscript>
      <p>
        JavaScript отключен. Автопереход может не сработать; откройте
        <a href="./public/index.html">public</a>
        или
        <a href="./Public/index.html">Public</a>.
      </p>
      <meta http-equiv="refresh" content="0; url=./public/index.html" />
    </noscript>
  </body>
</html>
